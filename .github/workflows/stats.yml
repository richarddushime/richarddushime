name: Generate GitHub Stats
# This workflow generates the README's stats cards (light and dark) and latest Medium posts.
on:
  schedule:
    - cron: '0 6 * * *' # once a day
  push:
    branches:
      - main
    paths:
      - '.github/workflows/stats.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rewrites the list between the BLOG-POST-LIST markers in README.md.
      # Must run first: it does `git pull --rebase` even with skip_commit, which
      # fails once the card steps below have left uncommitted changes.
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: https://medium.com/feed/@richarddushime
          max_post_count: 4
          skip_commit: true # committed together with the cards below
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          # count_private only takes effect if TROPHY has the `repo` scope.
          options: username=richarddushime&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=default
          path: profile/stats-light.svg
          token: ${{ secrets.TROPHY }}
          fail_on_error: true # keep the last good card instead of committing an error card
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=richarddushime&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=github_dark
          path: profile/stats-dark.svg
          token: ${{ secrets.TROPHY }}
          fail_on_error: true
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=richarddushime&layout=compact&langs_count=8&hide_border=true&theme=default
          path: profile/top-langs-light.svg
          token: ${{ secrets.TROPHY }}
          fail_on_error: true
      - uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=richarddushime&layout=compact&langs_count=8&hide_border=true&theme=github_dark
          path: profile/top-langs-dark.svg
          token: ${{ secrets.TROPHY }}
          fail_on_error: true
      - uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=richarddushime&hide_border=true&theme=default
          path: profile/streak-light.svg
          token: ${{ secrets.TROPHY }}
      - uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=richarddushime&hide_border=true&theme=github-dark
          path: profile/streak-dark.svg
          token: ${{ secrets.TROPHY }}
      - name: Commit and push stats cards
        run: |
          if [[ "$(git status --porcelain)" != "" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add profile/*.svg README.md
            git commit -m "Update stats cards"
            # trophy.yml also pushes to main; rebase in case it landed first.
            git pull --rebase
            git push
          fi
